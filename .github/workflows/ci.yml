name: CI                                    # name shown on GitHub's Actions tab

on:
  push:                                     # trigger: runs on every push
    branches: [ main ]
  pull_request:                             # also runs when a PR is opened against main
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest                  # GitHub spins up a fresh Ubuntu machine for this

    steps:
      - name: Checkout code
        uses: actions/checkout@v4           # pulls your repo's code onto that machine

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'           # same Java distribution you use locally

      - name: Run tests
        run: ./mvnw test                    # exact same command you've been running locally